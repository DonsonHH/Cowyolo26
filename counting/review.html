<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>奶牛通行 · 人工复核</title>
<style>
:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#e7edf3;background:#101720}*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1500px;margin-inline:auto}h1{font-size:25px;margin:0 0 8px}p{line-height:1.65;color:#b9c8d7}.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(310px,1fr);gap:20px}.card{background:#192330;border:1px solid #334358;border-radius:12px;padding:16px}.video{position:relative;background:#000;min-height:180px}video{width:100%;display:block}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}button,input,select{font:inherit;border-radius:7px;border:1px solid #51657d;background:#26374b;color:#fff;padding:8px}button{cursor:pointer}button:hover{background:#36516f}button.primary{background:#176754}input[type=number]{width:110px}input[type=text]{max-width:200px}#notice{color:#ffce89}.stamp{font:16px ui-monospace,monospace;color:#ffe2ae}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:7px 3px;border-bottom:1px solid #39485c;text-align:left}.small{font-size:12px;color:#b9c8d7}.warn{color:#f5c583}label{display:block;margin:10px 0}#draft{font-size:12px;white-space:pre-wrap}a{color:#9cd7ff}@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style>
<h1>奶牛通道 · 人工逐事件复核</h1>
<p>仅显示原始视频和橙色通道。查看源帧 <strong id="scope"></strong>，逐次记录完整通行；遮挡、截断或无法确定的情况单列。页面不显示模型预测。</p>
<p id="notice">正在检查源视频……</p>
<div class="grid"><section class="card">
<div class="video"><video id="video" controls preload="metadata" style="display:none"></video><img id="rawImage" alt="原始视频源帧" style="width:100%;display:block"><canvas id="overlay"></canvas></div>
<div class="controls"><button id="play">播放／暂停</button><button id="begin">回到范围起点</button><button id="prev">上一帧 ←</button><button id="next">下一帧 →</button><button id="mode">切换视频模式</button><select id="speed"><option value="0.25">0.25倍速</option><option value="0.5">0.5倍速</option><option value="1" selected>1倍速</option></select></div>
<div class="controls"><input id="seek" type="number" aria-label="源帧号"><button id="go">跳到源帧</button><span id="stamp" class="stamp"></span></div><p id="mediaStatus" class="small">等待视频元数据</p>
<p class="small">空格播放／暂停；左右键逐帧。先标记进入A或B区；完成通行时，点“补充画面位置”并点击该牛可见躯干中心，再记录方向。不需要画标注框。</p>
</section><section class="card">
<h2 style="font-size:18px;margin-top:0">记录一次通行</h2>
<button id="entry">① 标记进入时刻（I）</button><p id="entryText" class="stamp">尚未标记进入</p>
<div class="controls"><button id="down" class="primary">② 完成 A→B（D）</button><button id="up">② 完成 B→A（U）</button></div>
<div class="controls"><button id="uncertain">记录遮挡／不确定</button><button id="truncated">记录视频截断</button><button id="position">补充画面位置</button></div>
<label>备注 <input id="notes" type="text" aria-label="事件备注"></label>
<p id="feedback" class="small" role="status"></p>
<h2 style="font-size:18px">已记录 <span id="total">0</span> 次完整通行</h2><div style="max-height:240px;overflow:auto"><table><thead><tr><th>编号</th><th>方向</th><th>进入→完成帧</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
<p id="uncertainCount" class="small"></p>
<label>复核者 <input id="reviewer" type="text" aria-label="复核者"></label>
<label><input id="checked" type="checkbox"> 我已检查完整指定范围及每条事件</label>
<button id="export" class="primary">导出复核JSON</button><p class="small">自动保存草稿到本浏览器。勾选完整复核并填写复核者后才导出为 reviewed；其余情况导出 draft。数量无需被强制填成12。</p>
</section></div>
<script>
let meta,items=[],uncertain=[],entry=null,selectedPosition=null,storeKey,frameMode=true,cursorFrame=0,compatPlaying=false,frameLoading=true,editingEvent=null;
const $=id=>document.getElementById(id),v=$('video'),canvas=$('overlay'),ctx=canvas.getContext('2d');
const frame=()=>frameMode?cursorFrame:Math.round(v.currentTime*meta.source_fps),message=text=>$('feedback').textContent=text;
function persist(){localStorage.setItem(storeKey,JSON.stringify({items,uncertain,entry,reviewer:$('reviewer').value}));}
function redraw(){const image=frameMode?$('rawImage'):v;const W=frameMode?image.naturalWidth:v.videoWidth,H=frameMode?image.naturalHeight:v.videoHeight;if(!W)return;canvas.width=W;canvas.height=H;ctx.strokeStyle='#ffad45';ctx.lineWidth=Math.max(3,W/500);ctx.strokeRect(W*.34,2,W*(.75-.34),H-4);ctx.setLineDash([16,12]);for(const y of [.4,.6]){ctx.beginPath();ctx.moveTo(W*.34,H*y);ctx.lineTo(W*.75,H*y);ctx.stroke();}ctx.setLineDash([]);ctx.fillStyle='#ffcd85';ctx.font=`${Math.round(W/70)}px sans-serif`;ctx.fillText('A',W*.35,H*.35);ctx.fillText('B',W*.35,H*.7);}
function update(){if(!meta)return;const f=frame();$('stamp').textContent=`源帧 ${f} · ${(f/meta.source_fps).toFixed(3)} s`;$('seek').value=f;const end=meta.reviewed_interval.end_frame0;if(f>end&& !v.paused){v.pause();v.currentTime=end/meta.source_fps;}}
function seek(f,keepPlaying=false){v.pause();if(!keepPlaying)compatPlaying=false;f=Math.max(meta.reviewed_interval.start_frame0,Math.min(meta.reviewed_interval.end_frame0,Math.round(f)));if(frameMode){frameLoading=true;cursorFrame=f;$('rawImage').src='/frame.jpg?frame0='+f;}else{v.currentTime=f/meta.source_fps;}update();}
function togglePlay(){if(frameMode){compatPlaying=!compatPlaying;if(compatPlaying)seek(frame()+1,true);}else{v.paused?v.play():v.pause();}}
$('rawImage').onload=()=>{frameLoading=false;redraw();$('mediaStatus').textContent='逐帧原画面模式 · 每张画面对应指定源帧';if(compatPlaying&&frame()<meta.reviewed_interval.end_frame0)setTimeout(()=>{if(compatPlaying)seek(frame()+1,true);},1000/(meta.source_fps*Number($('speed').value)));};
$('rawImage').onerror=()=>{compatPlaying=false;$('mediaStatus').textContent='源帧加载失败，请稍后重试。';};
$('play').onclick=togglePlay;$('mode').onclick=()=>{const current=frame();compatPlaying=false;frameMode=!frameMode;$('rawImage').style.display=frameMode?'block':'none';v.style.display=frameMode?'none':'block';$('mode').textContent=frameMode?'切换视频模式':'切换逐帧模式';if(!frameMode&&!v.src)v.src='/source.mp4';seek(current);};
function render(){const body=$('rows');body.replaceChildren();items.forEach((x,i)=>{const row=document.createElement('tr');[x.event_id,x.direction,`${x.entry_source_frame0} → ${x.completion_source_frame0}`].forEach(t=>{const c=document.createElement('td');c.textContent=t;row.append(c);});const cell=document.createElement('td'),point=document.createElement('button'),button=document.createElement('button');point.textContent=x.passage_position_or_local_trajectory?'改点':'补点';point.onclick=()=>{editingEvent=x.event_id;seek(x.completion_source_frame0);message('已跳到完成帧，等待画面显示后点“补充画面位置”并点击躯干中心。');};button.textContent='删除';button.onclick=()=>{items.splice(i,1);persist();render();};cell.append(point,button);row.append(cell);body.append(row);});$('total').textContent=items.length;$('uncertainCount').textContent=`另记 ${uncertain.length} 条不确定／截断。`;$('entryText').textContent=entry===null?'尚未标记进入':`进入源帧 ${entry}`;}
function markEntry(){if(!meta?.source_integrity_verified||frameLoading)return message('请等待指定源帧显示后再标记。');entry=frame();selectedPosition=null;persist();render();message('已标记进入；在另一侧完成通行时记录方向。');}
function complete(direction){if(frameLoading)return message('请等待指定源帧显示后再标记。');const f=frame();if(entry===null||f<=entry)return message('请先标记更早的进入时刻。');if(!selectedPosition||selectedPosition.source_frame0!==f)return message('请先点“补充画面位置”，在当前完成帧点击该牛的可见躯干中心。');items.push({video_id:meta.video_id,session_id:meta.session_id,event_id:`event_${Date.now()}_${items.length+1}`,direction,entry_time_s:entry/meta.source_fps,time_s:f/meta.source_fps,entry_source_frame0:entry,completion_source_frame0:f,key_source_frames0:[entry,f],passage_position_or_local_trajectory:selectedPosition,status:'complete',occlusion:$('notes').value||null,review_status:'reviewed',notes:$('notes').value});entry=null;$('notes').value='';persist();render();message('完整通行已记录。');}
$('entry').onclick=markEntry;$('down').onclick=()=>complete('A->B');$('up').onclick=()=>complete('B->A');
function uncertainRecord(status){if(frameLoading)return message('请等待指定源帧显示后再标记。');uncertain.push({video_id:meta.video_id,session_id:meta.session_id,source_frame0:frame(),time_s:frame()/meta.source_fps,status,notes:$('notes').value,review_status:'reviewed'});persist();render();message('已单列，不计入完整通行。');}
$('uncertain').onclick=()=>uncertainRecord('ambiguous');$('truncated').onclick=()=>uncertainRecord('truncated');
$('position').onclick=()=>{if(frameLoading)return message('请等待源帧显示。');compatPlaying=false;v.pause();canvas.style.pointerEvents='auto';message('请点击画面中该奶牛的中心位置。');};
canvas.onclick=e=>{const b=canvas.getBoundingClientRect();selectedPosition={source_frame0:frame(),x:Math.round((e.clientX-b.left)/b.width*canvas.width),y:Math.round((e.clientY-b.top)/b.height*canvas.height)};canvas.style.pointerEvents='none';if(editingEvent){const event=items.find(x=>x.event_id===editingEvent);if(event&&event.completion_source_frame0===frame()){event.passage_position_or_local_trajectory=selectedPosition;persist();render();message('已有事件的位置已更新。');editingEvent=null;return;}editingEvent=null;}message('位置已记录，将写入下一条完整事件。');};
$('begin').onclick=()=>seek(meta.reviewed_interval.start_frame0);$('prev').onclick=()=>seek(frame()-1);$('next').onclick=()=>seek(frame()+1);$('go').onclick=()=>seek(Number($('seek').value));$('speed').onchange=()=>v.playbackRate=Number($('speed').value);$('reviewer').oninput=persist;
$('export').onclick=()=>{const completePositions=items.every(x=>x.passage_position_or_local_trajectory);const reviewed=$('checked').checked&&$('reviewer').value.trim()&&completePositions;const value={...meta,review_status:reviewed?'reviewed':'draft',reviewer:$('reviewer').value.trim()||null,reviewed_at:new Date().toISOString(),review_method:'human source-only review; no model predictions displayed',events:items,uncertain_or_truncated_records:uncertain};delete value.event_record_template;delete value.source_integrity_verified;delete value.downloaded_bytes;const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(value,null,2)],{type:'application/json'}));a.download=`cow_events_${value.review_status}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);message(`已导出 ${value.review_status} JSON，共 ${items.length} 次完整通行。`+(completePositions?'':' 请用表格“补点”补齐位置后再导出reviewed。'));};
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||!meta)return;if(e.code==='Space'){e.preventDefault();togglePlay();}if(e.code==='ArrowLeft'){e.preventDefault();seek(frame()-1);}if(e.code==='ArrowRight'){e.preventDefault();seek(frame()+1);}if(e.key.toLowerCase()==='i')markEntry();if(e.key.toLowerCase()==='d')complete('A->B');if(e.key.toLowerCase()==='u')complete('B->A');});
v.addEventListener('loadedmetadata',()=>{if(!frameMode){redraw();seek(cursorFrame||meta.reviewed_interval.start_frame0);$('mediaStatus').textContent=`视频 ${v.videoWidth}×${v.videoHeight}，${v.duration.toFixed(2)}秒`;}});v.addEventListener('timeupdate',update);v.addEventListener('seeked',()=>{if(!frameMode)frameLoading=false;update();});
v.addEventListener('error',()=>{$('mediaStatus').textContent='视频解码失败：'+(v.error?.message||'浏览器未返回细节');});
async function init(){meta=await(await fetch('/metadata.json')).json();$('scope').textContent=`${meta.reviewed_interval.start_frame0}–${meta.reviewed_interval.end_frame0}`;storeKey='cow-source-review:'+meta.source_video_sha256;try{const saved=JSON.parse(localStorage.getItem(storeKey));if(saved){items=saved.items||[];uncertain=saved.uncertain||[];entry=saved.entry;$('reviewer').value=saved.reviewer||'';}}catch{}render();if(meta.source_integrity_verified){$('notice').textContent='原视频SHA-256已核对。橙框内完整通行计数；其他范围不纳入。';seek(meta.reviewed_interval.start_frame0);}else{$('notice').textContent=`源视频传输／完整性检查中：${Math.round(meta.downloaded_bytes/1048576)} MiB。就绪后自动加载。`;setTimeout(init,5000);}}
init();
</script></html>
