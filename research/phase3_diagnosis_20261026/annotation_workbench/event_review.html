<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>奶牛通行事件差异核查</title>
<style>:root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#eef3f4;background:#11191d;color-scheme:dark}*{box-sizing:border-box}body{margin:0}main{max-width:1500px;margin:auto;padding:24px}h1{font-size:25px;margin:0 0 10px}h2{font-size:17px;margin:0 0 8px}p{line-height:1.65;color:#b9c9cf}a{color:#b3ebd3}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:16px 0}select,button{font:inherit;border:1px solid #526772;border-radius:6px;padding:9px 11px;background:#243943;color:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:default}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.card{padding:14px;border:1px solid #34434b;background:#19252b;border-radius:10px}.card img{display:block;width:100%;height:auto;border-radius:7px;background:#050808}.notice{background:#1e302e;border-left:3px solid #ace1cc;padding:12px 16px;line-height:1.65}.muted{font-size:13px;color:#afbec5}.clock{font:600 16px ui-monospace,monospace;color:#b3ebd3}.counts{line-height:1.7;color:#d6c79a}#observation{padding:0 0 0 12px;border-left:2px solid #526772}@media(max-width:800px){main{padding:14px}.grid{grid-template-columns:1fr}}</style>
<main><h1>为什么同一原片输出7、8、6、8次？</h1><p>从源帧8912–10873中选取四处预测分歧，每处固定展示5个源帧。<a href="training_preview.html">返回完整模型回放</a> · <a href="index.html">查看原片与标注</a></p><div class="notice">本页帮助比较框和临时轨迹，保留各模型实际输出。画面观察及预测差异供排查使用，最终通行参考仍由独立人工复核确定。同一帧的两个事件可能对应两头并排奶牛，需要回查各自经过过程。</div>
<div class="row"><label for="case">争议位置</label><select id="case"><option value="case1">373.8秒 · 同帧两事件</option><option value="case2">379.0秒 · 单模型新增</option><option value="case3">387.8秒 · 跨模型缺失</option><option value="case4">391.6秒 · 单模型跨区</option></select><button id="previous">前一张</button><select id="frame" aria-label="原始源帧"></select><button id="next">后一张</button><span id="clock" class="clock">正在载入…</span><a id="native" href="#" target="_blank">打开本帧原图</a></div>
<p id="counts" class="counts"></p><p id="observation"></p><div class="grid" id="models"></div><p id="status" class="muted" role="status">正在载入核查图像…</p><p class="muted">每处图像取自预测事件中心前后2秒，每隔1秒一张，沿用原始25fps源帧号。模型为五轮版本及20轮的三个seed。所选画面来自已用开发片段，不作为全新测试。<a href="event_review_data.json">查看源文件hash、轨迹记录与选取规则</a></p></main>
<script>'use strict';const $=id=>document.getElementById(id);let data=null;const labels={pilot:'五轮模型',epoch20_seed26:'20轮 · seed26',epoch20_seed27:'20轮 · seed27',epoch20_seed28:'20轮 · seed28'};function currentCase(){return data.cases.find(c=>c.case_id===$('case').value)}function renderFrame(){const c=currentCase(),f=c.frames.find(r=>r.source_frame===Number($('frame').value));$('clock').textContent=`源帧${f.source_frame} · ${f.time_s.toFixed(2)}秒`;$('native').href=f.native_url;$('models').replaceChildren();for(const item of f.models){const card=document.createElement('section');card.className='card';const h=document.createElement('h2');h.textContent=labels[item.model];const p=document.createElement('p');p.className='muted';p.textContent=`本帧输出轨迹：${item.track_ids.join('、')||'无'}${item.events_at_this_frame.length?' · 本帧触发'+item.events_at_this_frame.length+'事件':''}`;const image=document.createElement('img');image.src=item.url;image.alt=`${labels[item.model]}，源帧${f.source_frame}的实际框和临时轨迹`;image.onload=()=>{$('status').textContent='源帧图像已载入，可比较模型或打开原图。'};image.onerror=()=>{$('status').textContent='图像未能载入，请检查本机服务。'};card.append(h,p,image);$('models').append(card)}const i=c.frames.indexOf(f);$('previous').disabled=i===0;$('next').disabled=i===c.frames.length-1}function renderCase(){const c=currentCase();$('frame').replaceChildren();for(const f of c.frames){const option=document.createElement('option');option.value=f.source_frame;option.textContent=`${f.source_frame} · ${f.time_s.toFixed(2)}秒`;$('frame').append(option)}$('frame').value=c.centre_source_frame;$('counts').textContent='本处前后2秒内的预测事件：'+Object.entries(c.predicted_events_in_4second_window).map(([m,events])=>`${labels[m]} ${events.length}次`).join('；');$('observation').textContent='画面排查记录：'+c.observation.note;renderFrame()}$('case').onchange=renderCase;$('frame').onchange=renderFrame;function step(delta){const c=currentCase(),i=c.frames.findIndex(f=>f.source_frame===Number($('frame').value));const f=c.frames[i+delta];if(f){$('frame').value=f.source_frame;renderFrame()}}$('previous').onclick=()=>step(-1);$('next').onclick=()=>step(1);fetch('event_review_data.json').then(r=>{if(!r.ok)throw Error('材料未就绪');return r.json()}).then(value=>{data=value;renderCase()}).catch(e=>{$('status').textContent='核查材料尚未就绪，请稍后刷新。'});</script></html>
